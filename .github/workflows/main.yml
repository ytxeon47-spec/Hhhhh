name: Tiny10 23H2 QEMU (Fix Cursor Freeze)

on:
  workflow_dispatch:

jobs:
  run-tiny10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/4] Installing QEMU, KVM & Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-gui \
            qemu-utils \
            genisoimage \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            p7zip-full \
            unzip

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (256GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 256G

          echo "=== Creating Secondary USB Flash Drive (32GB RAW) ==="
          qemu-img create -f raw /tmp/usb_flash_32G.img 32G

      - name: 2. Download Tiny10 ISO, SharedGL & Build Secondary ISO
        run: |
          echo "=== [STEP 2/4] Downloading ISOs & SharedGL ==="
          
          TINY10_URL="https://archive.org/download/tiny-10-23-h2/tiny10%20x64%2023h2.iso"
          VIRTIO_URL="https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/latest-virtio/virtio-win.iso"
          SHAREDGL_URL="https://github.com/dmaivel/sharedgl/releases/download/v0.10.0/sharedgl-v0.10.0-windows.zip"

          echo "Downloading Tiny10 ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o tiny10.iso "$TINY10_URL" || wget -O /tmp/tiny10.iso "$TINY10_URL"

          echo "Downloading VirtIO Drivers ISO..."
          wget -O /tmp/virtio.iso "$VIRTIO_URL"

          echo "Downloading and Unpacking SharedGL..."
          mkdir -p /tmp/sharedgl
          wget -O /tmp/sharedgl.zip "$SHAREDGL_URL"
          unzip -o /tmp/sharedgl.zip -d /tmp/sharedgl/

          mkdir -p /tmp/custom_iso
          
          echo "Extracting VirtIO Drivers..."
          7z x /tmp/virtio.iso -o/tmp/custom_iso/VirtIO_Drivers -y

          echo "Copying SharedGL..."
          cp -r /tmp/sharedgl /tmp/custom_iso/SharedGL

          echo "Generating Custom Drivers & SharedGL ISO..."
          genisoimage -o /tmp/software.iso -R -J /tmp/custom_iso

      - name: 3. Connect Tailscale
        run: |
          echo "=== [STEP 3/4] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          AUTH_KEY="${{ secrets.TAILSCALE_AUTHKEY }}"
          
          if [ -n "$AUTH_KEY" ]; then
            sudo tailscale up --authkey="$AUTH_KEY" --hostname="tiny10-qemu-runner-${{ github.run_id }}" --accept-routes || true
          fi

          TS_IP=$(tailscale ip -4 || true)
          if [ -z "$TS_IP" ]; then
            timeout 15s sudo tailscale up --hostname="tiny10-qemu-runner-${{ github.run_id }}" --accept-routes || true
            sudo tailscale up --hostname="tiny10-qemu-runner-${{ github.run_id }}" --accept-routes > /dev/null 2>&1 &
            
            RETRIES=0
            while [ -z "$TS_IP" ] && [ $RETRIES -lt 60 ]; do
                TS_IP=$(tailscale ip -4 || true)
                sleep 3
                RETRIES=$((RETRIES+1))
            done
          fi

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale failed!"
            exit 1
          fi

          echo "Tailscale IP: $TS_IP"
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 4. Launch QEMU Tiny10 & noVNC Web Access
        run: |
          echo "=== [STEP 4/4] Starting QEMU Tiny10 Machine ==="
          
          export QEMU_AUDIO_DRV=none

          # ОЗУ: 16.4 ГБ = 16793 МБ
          # USB 3.0 + virtio-vga для исключения лагов и фризов курсора
          qemu-system-x86_64 \
            -enable-kvm \
            -machine pc,accel=kvm \
            -m 16793 \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu max,check=off \
            -boot d \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk,cache=unsafe,aio=threads \
            -drive file=/tmp/tiny10.iso,index=1,media=cdrom \
            -drive file=/tmp/software.iso,index=2,media=cdrom \
            -drive file=/tmp/usb_flash_32G.img,id=usbflash,format=raw,if=none \
            -device usb-storage,drive=usbflash \
            -vga virtio \
            -device qemu-xhci,id=xhci \
            -device usb-tablet,bus=xhci.0 \
            -vnc 127.0.0.1:0 \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          websockify --web "$NOVNC_DIR" --heartbeat=10 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " TINY10 23H2 SETUP READY"
          echo " RAM Allocated : 16.4 GB (16793 MB)"
          echo " Web VNC URL   : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done

